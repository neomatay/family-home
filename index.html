<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* 布局概念：家为导航中枢，房间内页单列卡片工具风 */
:root{
  --bg:#F6F1E9; --surface:#FFFCF7; --ink:#40382F; --ink2:#8A8072;
  --line:#E7DECF; --accent:#3E7A66; --warm:#D0832F; --danger:#B85C4A;
  --h-wall:#F3E8D4; --h-wall2:#E7D8BC; --h-slab:#C39A73; --h-wood:#B08557;
  --h-fridge:#DCE5E2; --h-frline:#B7C4C0; --h-roof:#C0755B; --h-window:#CBE3EA;
  --h-bed:#A8C3B5; --h-cat1:#E2A65E; --h-cat2:#9A9AA3; --h-cat3:#F4EEDF;
  --h-glow:rgba(224,158,63,.16); --h-shadow:rgba(64,56,47,.10); --h-door:#9A6B4F;
  --dot-on:#D0832F; --dot-mut:#B3A896;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#221F1A; --surface:#2B2721; --ink:#EAE2D6; --ink2:#A29A8C;
    --line:#3B362D; --accent:#8CC5AF; --warm:#E3B268; --danger:#D98A78;
    --h-wall:#4A4234; --h-wall2:#3E372C; --h-slab:#6B5741; --h-wood:#6B5741;
    --h-fridge:#55605C; --h-frline:#6E7B77; --h-roof:#7C493C; --h-window:#3E4A57;
    --h-bed:#5C7768; --h-cat1:#B58444; --h-cat2:#74747E; --h-cat3:#B9B2A0;
    --h-glow:rgba(227,178,104,.20); --h-shadow:rgba(0,0,0,.35); --h-door:#6B4A37;
    --dot-on:#E3B268; --dot-mut:#6E675A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221F1A; --surface:#2B2721; --ink:#EAE2D6; --ink2:#A29A8C;
  --line:#3B362D; --accent:#8CC5AF; --warm:#E3B268; --danger:#D98A78;
  --h-wall:#4A4234; --h-wall2:#3E372C; --h-slab:#6B5741; --h-wood:#6B5741;
  --h-fridge:#55605C; --h-frline:#6E7B77; --h-roof:#7C493C; --h-window:#3E4A57;
  --h-bed:#5C7768; --h-cat1:#B58444; --h-cat2:#74747E; --h-cat3:#B9B2A0;
  --h-glow:rgba(227,178,104,.20); --h-shadow:rgba(0,0,0,.35); --h-door:#6B4A37;
  --dot-on:#E3B268; --dot-mut:#6E675A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(14px,env(safe-area-inset-top,0px));
  padding-bottom:max(30px,env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
.page{max-width:460px;margin-inline:auto}
.display{font-family:"ZCOOL XiaoWei","Noto Sans SC",serif;font-weight:400}
button{font-family:inherit}

/* 头部 */
header{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:38px}
#backBtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
#vTitle{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#themeBtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
#themeBtn svg{width:16px;height:16px}
#meChip{
  display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px;flex:none;
}
#meChip .av{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

/* 通用卡片 */
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 15px}
.d{width:8px;height:8px;border-radius:50%;background:var(--dot-on);flex:none}
.d.mut{background:var(--dot-mut)}
.d.pulse{animation:dotp 2.2s ease-in-out infinite}
@keyframes dotp{0%,100%{opacity:1}50%{opacity:.3}}
.btn{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:500;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;transform:none}

/* 首页 */
.greet-date{font-size:11.5px;color:var(--ink2);letter-spacing:.5px}
.greet-title{font-size:21px;margin:3px 0 13px}
.today{border:1px solid var(--line);border-radius:16px;padding:13px 14px 11px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));margin-bottom:14px;cursor:pointer}
.today .eyebrow{font-size:10.5px;letter-spacing:2px;color:var(--ink2)}
.today .row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:5px}
.today .dish{font-size:22px}
.today .when{font-size:12px;color:var(--ink2);white-space:nowrap}
.today .when b{color:var(--dot-on);font-weight:500}
.today .alert{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px}
.scene svg{display:block;width:100%;height:auto}
.demo-note{font-size:10.5px;color:var(--ink2);text-align:center;padding:8px 0 2px;letter-spacing:.5px}

/* 房屋 SVG 交互 */
.hot{cursor:pointer;fill:transparent;outline:none}
.hot:hover{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.hot:focus-visible{stroke:var(--accent);stroke-width:2.5}
.dim{opacity:.55;filter:saturate(.3)}
.steam{animation:steam 2.6s ease-in-out infinite}
.steam.s2{animation-delay:.9s}.steam.s3{animation-delay:1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}35%{opacity:.55}100%{opacity:0;transform:translateY(-9px)}}
.smoke{animation:dotp 3.4s ease-in-out infinite}
.smoke.s2{animation-delay:1.2s}.smoke.s3{animation-delay:2.3s}
svg text{user-select:none}

/* 房间视图 */
.view{display:none}
.view.on{display:block}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.vhead .vt{font-size:15px;font-weight:700}
.vhead .vs{font-size:11.5px;color:var(--ink2);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px}
/* 猫角 · 嵌入猫猫管家的房间窗口 */
.catframe{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;height:70vh}
.catframe iframe{display:block;width:100%;height:100%;border:0;background:var(--surface)}
.catload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px;background:var(--surface)}

/* 厨房 */
.ktab{display:flex;gap:6px;margin-bottom:12px}
.ktab button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;cursor:pointer}
.ktab button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
/* 玄关 tab（结构与厨房 ktab 同款，但独立绑定，见 renderList） */
.ltab{display:flex;gap:6px;margin-bottom:12px}
.ltab button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;cursor:pointer}
.ltab button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.dish-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dish-name{font-size:19px}
.times{font-size:11px;color:var(--ink2);white-space:nowrap}
.nutri{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 10px}
.nutri span{font-size:10.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2.5px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.nutri .est{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.dish-bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cooks{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2)}
.cooks .av{width:21px;height:21px;font-size:10px}
.res-date{font-size:11px;color:var(--dot-on);font-weight:700;letter-spacing:1px;margin-bottom:5px}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.res-cook{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.res-cook .waiting{color:var(--dot-on);font-weight:500}
.res-acts{display:flex;gap:8px;margin-left:auto}
.res-acts .btn{padding:5px 13px;font-size:12px;border-radius:8px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.8}

/* 冰箱 */
.igroup{margin-bottom:16px}
.ig-title{font-size:12px;color:var(--ink2);letter-spacing:2px;margin:0 0 8px 4px}
.irow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:9px 12px;margin-bottom:7px;cursor:pointer}
.irow .name{flex:1;min-width:0;font-size:14px;font-weight:500}
.irow .name .left{display:block;font-size:11px;color:var(--ink2);font-weight:400;margin-top:1px}
.irow .name .left.low{color:var(--dot-on)}
.step{display:flex;align-items:center;gap:7px;flex:none}
.step button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer;line-height:1}
.step b{font-size:13.5px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.step .unit{font-size:11px;color:var(--ink2)}

/* 购物清单 */
.lrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 13px;margin-bottom:7px}
.lrow .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;padding:0}
.lrow.done .ck{background:var(--accent);border-color:var(--accent)}
.lrow.done .lname{text-decoration:line-through;color:var(--ink2)}
.lname{flex:1;min-width:0;font-size:14px;font-weight:500}
.lname .note{display:block;font-size:11px;color:var(--ink2);font-weight:400;margin-top:1px}
.lrow .x{width:26px;height:26px;border:none;background:none;color:var(--ink2);font-size:14px;cursor:pointer;flex:none}
.clrbar{display:flex;justify-content:flex-end;margin-top:4px}

/* 玄关 · 生日挂念（v0.6） */
.bdrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 13px;margin-bottom:7px;cursor:pointer;font:inherit;color:inherit}
.bdrow .bmain{flex:1;min-width:0}
.bdrow .bname{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.bdrow .bsub{display:block;font-size:11px;color:var(--ink2);margin-top:1px}
.bdrow .bnote{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.bdcount{flex:none;text-align:right;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bdcount b{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:1px}
.bdcount.today b{color:var(--dot-on)}
.bdcount.soon b{color:var(--accent)}
.selrow{display:flex;gap:8px}
.selrow select{flex:1;min-width:0}

/* 卧室 · 生理期（v0.3.2 重构：总览 + 每月开始日格子 + 间隔趋势 + 折叠历史） */
.ptab{display:flex;gap:6px;margin-bottom:12px}
.ptab button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;cursor:pointer}
.ptab button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cycle-overview{padding:16px;margin-bottom:10px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.cycle-overview .eyebrow{font-size:10.5px;letter-spacing:1.5px;color:var(--ink2)}
.cycle-primary{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin:7px 0 15px}
.cycle-primary h2{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:0}
.cycle-primary h2 small{font-size:13px;color:var(--ink2);font-weight:400;margin-left:4px;letter-spacing:0}
.cycle-state{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;white-space:nowrap}
.cycle-state .d{width:7px;height:7px}
.cycle-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:13px;border-top:1px solid var(--line)}
.cycle-metric{min-width:0}
.cycle-metric span{display:block;color:var(--ink2);font-size:10.5px;margin-bottom:4px;white-space:nowrap}
.cycle-metric b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cycle-metric b em{font-style:normal;font-size:10px;color:var(--ink2);font-weight:400;margin-left:2px}
.cycle-metric .muted{font-size:12px;color:var(--ink2);font-weight:500}
.cycle-due{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink2)}
.cycle-due b{color:var(--ink);font-size:12px;font-weight:600}
.cycle-due .late{color:var(--dot-on)}
.cycle-year{padding:15px;margin-bottom:10px}
.cycle-year-nav{display:flex;align-items:center;gap:9px}
.cycle-year-nav strong{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cycle-year-nav button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;line-height:1}
.cycle-year-nav button:disabled{opacity:.35;cursor:default}
.month-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.month-cell{min-width:0;min-height:55px;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.month-cell.filled{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.month-cell span{display:block;color:var(--ink2);font-size:10px}
.month-cell strong{display:block;margin-top:3px;color:var(--ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-cell:not(.filled) strong{color:var(--ink2);font-weight:400}
.cycle-trend{padding:15px;margin-bottom:10px}
.cycle-section-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:5px 10px;margin-bottom:12px}
.cycle-section-head h3{margin:0;font-size:14px;font-weight:700}
.cycle-section-head p{margin:3px 0 0;font-size:10.5px;color:var(--ink2)}
.cycle-average{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.cycle-average b{color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums}
.bar-chart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));align-items:end;gap:7px;height:132px;padding:0 2px 0;border-bottom:1px solid var(--line)}
.bar-col{display:grid;grid-template-rows:18px 1fr 22px;align-items:end;min-width:0;height:100%;text-align:center}
.bar-col .bar-value{font-size:9px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar-track{height:100%;display:flex;align-items:flex-end;justify-content:center;min-height:1px}
.bar-track i{display:block;width:min(26px,72%);min-height:7px;border-radius:5px 5px 0 0;background:var(--accent);opacity:.84}
.bar-col.latest .bar-track i{background:var(--warm);opacity:1}
.bar-col small{display:block;overflow:hidden;color:var(--ink2);font-size:9px;line-height:22px;white-space:nowrap;text-overflow:ellipsis}
.cycle-axis{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--ink2);font-size:10px}
.cycle-axis i{display:block;width:8px;height:8px;border-radius:2px;background:var(--warm)}
.cycle-axis span{margin-left:auto}
.cycle-history{margin-top:2px}
.cycle-history-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.cycle-history-toggle span{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cycle-history-toggle small{color:var(--ink2);font-size:10.5px;font-weight:400}
.cycle-history-toggle .chevron{font-size:15px;transition:transform .2s;flex:none}
.cycle-history-toggle.open .chevron{transform:rotate(180deg)}
.cycle-history-list{display:flex;flex-direction:column;gap:7px}
.history-year{margin:4px 2px 0;color:var(--ink2);font-size:11px;font-weight:600}
.history-row{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);padding:10px 12px;cursor:pointer;text-align:left;font-family:inherit}
.history-row:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.history-dot{width:8px;height:8px;border-radius:50%;background:var(--dot-mut);flex:none}
.history-date{flex:1;min-width:0}
.history-date strong{display:block;font-size:14px;font-weight:600}
.history-date small{display:block;margin-top:2px;color:var(--ink2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-gap{display:flex;align-items:baseline;gap:3px;min-width:70px;justify-content:flex-end}
.history-gap b{font-size:16px;font-variant-numeric:tabular-nums}
.history-gap small{color:var(--ink2);font-size:10px}
.history-edit{display:inline-flex;align-items:center;height:27px;padding:0 9px;border:1px solid var(--line);border-radius:8px;color:var(--ink2);font-size:11px;flex:none}
@media(max-width:390px){.history-edit{display:none}.history-gap{min-width:62px}.cycle-metric b{font-size:14px}}
.cycle-more{width:100%;padding:10px 0;border:0;background:transparent;color:var(--accent);font-size:11px;cursor:pointer}
.cycle-empty{padding:30px 18px}
/* 记录行（书房 · 周末新鲜事列表在用） */
.prow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 13px;margin-bottom:7px;cursor:pointer}
.prow .pdate{flex:1;min-width:0;font-size:14px;font-weight:500}
.prow .pdate .sub{display:block;font-size:11px;color:var(--ink2);font-weight:400;margin-top:1px;line-height:1.6}
.hint.dup{color:var(--dot-on)}

/* 书房 · 周末新鲜事 */
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12.5px;cursor:pointer}
.kchips button.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.kchips .kadd{border-style:dashed;background:transparent} /* ＋ 新类型（虚线，不参与单选） */
.krow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 13px;margin-bottom:7px}

function lunarYearDays(y){ /* 348 = 12×29 基准，12 个大月位（0x8000..0x10）各 +1，再加深月天数 */

  while(bit>0x8){if(b&bit)s+=1;bit>>=1}

   正常月过）；腊月三十遇无三十的年自动过廿九（ld 超 monthDays 收拢）。 */
function lunar2solar(y,lm,ld){
  if(y<1901||y>2100||lm<1||lm>12)return null;
  var off=0,yy;
  for(yy=1900;yy<y;yy++)off+=lunarYearDays(yy);
  for(var m=1;m<lm;m++)off+=lunarMonthDays(y,m);
  var leap=lunarLeapMonth(y);
  if(leap&&leap<lm)off+=lunarLeapDays(y);
  var md=lunarMonthDays(y,lm);
  var d=new Date(1900,0,31); /* 农历 1900 年正月初一 = 公历 1900-01-31 */
  d.setDate(d.getDate()+off+Math.min(ld,md)-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* 所有写操作走这里：执行 → 拉最新 → 渲染；失败提示（after 为字符串则 toast，为函数则执行） */
function run(p,after){

    });
  }).catch(function(e){

}

var FOOD={
  '牛腩':[332,26,0,23],'番茄':[18,0.9,3.9,0.2],'洋葱':[40,1.1,9,0.1],'姜':[46,1,10,0.5],
  '蒜':[128,6,28,0.5],'小葱':[30,1.7,5,0.3],'大葱':[30,1.7,6,0.1],'鸡蛋':[144,13,2,10],
  '面条':[350,11,75,1],'米饭':[116,2.6,26,0.3],'土豆':[77,2,17,0.1],'五花肉':[568,7,0,53],
  '鸡胸肉':[118,24,0,2],'鸡腿':[181,16,0,13],'排骨':[278,17,0,20],'虾':[93,18,2,0.8],
  '三文鱼':[139,17,0,8],'豆腐':[80,8,2,4],'白菜':[17,1.2,2,0.2],'青椒':[22,1,5,0.3],
  '胡萝卜':[39,0.9,9,0.2],'香菇':[34,2,5,0.3],'牛奶':[65,3.4,5,3.9],'南瓜':[23,1,5,0.1],
  '苹果':[52,0.3,14,0.2],'糖':[400,0,100,0],'食用油':[884,0,0,100],'生抽':[63,8,5,0],
  '醋':[31,0,2,0],'盐':[0,0,0,0],'蚝油':[114,5,8,2],'料酒':[106,0,0,0]
};
var UNIT_G={'克':1,'g':1,'毫升':1,'ml':1,'个':55,'只':55,'根':60,'片':8,'勺':12,'瓣':4,'适量':25,'少许':8,'千克':1000,'瓶':500,'罐':200,'包':100,'块':80};
var DEF=[120,7,10,5];
function estimate(ings,servings){
  var k=0,p=0,c=0,f=0,unknown=0;
  ings.forEach(function(ing){
    var db=FOOD[String(ing.name||'').trim()];
    if(!db){db=DEF;unknown++}
    var g=(parseFloat(ing.qty)||0)*(UNIT_G[ing.unit]||1);
    k+=db[0]*g/100;p+=db[1]*g/100;c+=db[2]*g/100;f+=db[3]*g/100;
  });
  var sv=Math.max(1,servings||1);
  return {k:Math.round(k/sv),p:Math.round(p/sv),c:Math.round(c/sv),f:Math.round(f/sv),unknown:unknown};
}

/* ---------- 库存比对（缺料 → 云端购物清单） ---------- */
function gramsOf(qty,unit){return (parseFloat(qty)||0)*(UNIT_G[unit]||1)}
function checkInv(d){
  var missing=[],adds=[];
  (d.ingredients||[]).forEach(function(ing){
    var needG=gramsOf(ing.qty,ing.unit),name=String(ing.name||'').trim();
    if(!name)return;
    var item=null;
    D.inv.forEach(function(it){if(it.cat==='food'&&it.name===name)item=it});
    var haveG=item?gramsOf(item.qty,item.unit):0;
    if(haveG<needG){
      var dupe=false;
      D.shop.forEach(function(s){if(!s.done&&s.name===name)dupe=true});
      if(!dupe)adds.push({family_id:AUTH.fid,name:name,note:'来自 '+d.name,done:false,created_by:AUTH.me});
      missing.push(name);
    }
  });
  var p=adds.length?api('POST','shopping',adds,'return=minimal'):Promise.resolve();
  return p.then(function(){return missing});
}
function lowCount(cat){
  var n=0;D.inv.forEach(function(it){if(it.cat===cat&&it.qty<it.low)n++});return n;
}
var MEALS=['早餐','午餐','晚餐','夜宵'];
var MEAL_RANK={'早餐':0,'午餐':1,'晚餐':2,'夜宵':3};
function mealRank(m){return (MEAL_RANK[m]!==undefined&&MEAL_RANK[m]!==null)?MEAL_RANK[m]:2} /* 未知值按晚餐排 */
function openRes(){
  return D.res.slice().sort(function(a,b){
    var c=(a.date||'').localeCompare(b.date||'');

/* ---------- 猫角：同源 iframe 嵌入 cat-health ----------
   两个应用同在 neomatay.github.io 域下，共用 localStorage，
   猫猫健康的家庭码登录态直接带进来，数据走它自己的 Supabase。
   主题桥接：把「家」的三态主题写进 iframe 的 :root[data-theme]，
   cat-health 的皮肤（v2.7+）按该属性切换暖色亮/暗。
   钥匙桥接（v0.4）：cat_link 表把猫猫健康的家庭 UUID 挂在「家」名下 ——
   任何一台设备输过一次猫角钥匙（cat_health_family_id）就自动上云，
   其他设备凭邀请码进家、点开猫角时先取钥匙写入 localStorage 再加载
   iframe，免二次进门。注意：这意味着邀请码同时解锁猫猫健康数据（有意为之）。 */
var CAT_URL='https://neomatay.github.io/cat-health/';
var CAT_KEY='cat_health_family_id'; /* cat-health 的登录钥匙（同域 localStorage 共享） */
var CATC={uid:null,got:false};      /* 云端桥接值缓存：got=已查过云端 */
function catLayout(){
  var box=document.getElementById('catFrameBox');
  if(!box)return;
  var top=box.getBoundingClientRect().top;
  box.style.height=Math.max(320,window.innerHeight-top-32)+'px';
}
function catTheme(){
  try{
    var doc=document.getElementById('catFrame').contentDocument;
    if(!doc||!doc.documentElement)return;
    var t=document.documentElement.dataset.theme;
    if(t==='dark'||t==='light')doc.documentElement.dataset.theme=t;
    else delete doc.documentElement.dataset.theme;
  }catch(_){} /* 本地调试时 iframe 跨源，静默跳过 */
}
function catLocalUid(){
  try{return localStorage.getItem(CAT_KEY)||''}catch(_){return ''}
}
/* 捕获：本机若持有猫角钥匙而云端没有/不一致，同步上云（一次输入，全家生效） */
function catPush(){
  var u=catLocalUid();
  if(!u||!AUTH)return;
  if(CATC.got&&CATC.uid===u)return;
  api('POST','cat_link?on_conflict=family_id&select=',
    {family_id:AUTH.fid,cat_family_id:u},
    'resolution=merge-duplicates,return=minimal'
  ).then(function(){
    CATC.got=true;CATC.uid=u;
    toast('猫角钥匙已存进云端，其他设备进家即自动登录');
  }).catch(function(){}); /* 静默：桥接失败不影响猫角本身 */
}
/* 分发：云端有钥匙而本机没有时，先写入 localStorage 再开门（免二次进门） */
function catPull(done){
  api('GET','cat_link?select=cat_family_id').then(function(r){
    CATC.got=true;
    if(r&&r[0]&&r[0].cat_family_id){
      CATC.uid=r[0].cat_family_id;
      if(catLocalUid()!==CATC.uid){
        try{localStorage.setItem(CAT_KEY,CATC.uid)}catch(_){}
      }
    }
  }).catch(function(){CATC.got=true}) /* 表还没建/网络问题：照常开门（维持旧行为） */
  .then(done);
}
function catBoot(){
  var f=document.getElementById('catFrame');
  if(!f||f.dataset.loaded)return;
  f.dataset.loaded='1';
  f.addEventListener('load',function(){
    var l=document.getElementById('catLoad');
    if(l)l.style.display='none';
    catTheme();
    catPush(); /* 用户可能刚在 iframe 里输过猫角钥匙，捕获上云 */
  });
  f.src=CAT_URL; /* 只加载一次，之后常驻（切走只是隐藏，状态不丢） */
}
function renderCat(){
  var f=document.getElementById('catFrame');
  if(!f)return;
  catLayout();
  if(!f.dataset.booted){
    f.dataset.booted='1';
    catPull(catBoot); /* 先取云端钥匙再开门；60s 轮询重渲染不会重复加载 */
    return;
  }
  catPush(); /* 常驻后再进猫角：顺便捕获本机新输的钥匙（iframe 内登录不触发 load） */
}

function renderCycle(){
  if(!UI.ptab||!member(UI.ptab))UI.ptab=(AUTH&&member(AUTH.me))?AUTH.me:(D.members[0]?D.members[0].id:null);
  var tb=document.getElementById('ptab');
  tb.innerHTML=D.members.map(function(m){
    return '<button data-act="ptab" data-mid="'+m.id+'" class="'+(m.id===UI.ptab?'on':'')+'">'+avHtml(m,20)+esc(m.name)+'</button>';
  }).join('');
  var me=member(UI.ptab),list=cycleData(UI.ptab),body=document.getElementById('cycleBody');
  if(!list.length){
    body.innerHTML='<div class="empty cycle-empty">'+esc(me?me.name:'')+'还没有记录<br>先记下最近一次来的日期，之后这里会自动算间隔和波动。<div class="sh-actions"><button class="btn" data-act="periodNew">记下第一次</button></div></div>';
    return;
  }
  var n=list.length,last=list[n-1],lastDay=dayDiff(last.date,todayIso());
  var gs=gapsOf(list),recentStart=Math.max(0,gs.length-8),recent=gs.slice(recentStart);
  var mean=meanNum(recent),latestGap=n>1?gs[gs.length-1]:null;
  var spread=recent.length?Math.max.apply(null,recent)-Math.min.apply(null,recent):0;
  var next=recent.length>=3&&spread<=10?isoShift(last.date,Math.round(mean)):null,due=next?dayDiff(todayIso(),next):null;
  var variation=recent.length?(Math.min.apply(null,recent)+'–'+Math.max.apply(null,recent)):'—';
  var stateText=lastDay<0?'日期在未来':'距这次开始 '+lastDay+' 天';
  var html='<section class="card cycle-overview">'+
    '<div class="eyebrow">'+esc(me?me.name:'')+' · '+last.date.slice(0,4)+' 年最近一次</div>'+
    '<div class="cycle-primary"><h2>'+cycleDateShort(last.date)+'<small>开始</small></h2><span class="cycle-state"><span class="d mut"></span>'+stateText+'</span></div>'+
    '<div class="cycle-metrics">'+
      '<div class="cycle-metric"><span>本次距上次</span><b>'+(latestGap!=null?latestGap:'—')+(latestGap!=null?'<em>天</em>':'')+'</b></div>'+
      '<div class="cycle-metric"><span>近 '+recent.length+' 次平均</span><b>'+(n>1?Math.round(mean):'—')+(n>1?'<em>天</em>':'')+'</b></div>'+
      '<div class="cycle-metric"><span>间隔范围</span><b class="'+(gs.length?'':'muted')+'">'+variation+(gs.length?'<em>天</em>':'')+'</b></div>'+
    '</div>';
  if(next){
    html+='<div class="cycle-due"><span>按近 '+recent.length+' 次间隔推算，仅供参考</span><b class="'+(due<0?'late':'')+'">'+dateLabel(next)+' · '+(due>0?'还有 '+due+' 天':due===0?'就是今天':'已过 '+(-due)+' 天')+'</b></div>';
  }else{
    html+='<div class="cycle-due"><span>'+(n===1?'再记 1 次，就能看到第一次间隔':recent.length<3?'再积累几次，才显示下次日期参考':'近期跨度 '+spread+' 天，不显示单日预测')+'</span><b>继续记录</b></div>';
  }
  html+='</section>';
  var firstYear=parseInt(list[0].date.slice(0,4),10),lastYear=Math.max(parseInt(todayIso().slice(0,4),10),parseInt(last.date.slice(0,4),10));
  if(UI.cycleYear==null||UI.cycleYear<firstYear||UI.cycleYear>lastYear)UI.cycleYear=parseInt(last.date.slice(0,4),10);
  var monthDays=[];
  for(var m=0;m<12;m++)monthDays.push([]);
  list.forEach(function(p){
    if(parseInt(p.date.slice(0,4),10)===UI.cycleYear)monthDays[parseInt(p.date.slice(5,7),10)-1].push(parseInt(p.date.slice(8,10),10));
  });
  html+='<section class="card cycle-year"><div class="cycle-section-head"><div><h3>每月哪天来的</h3><p>实际记录的开始日</p></div><div class="cycle-year-nav"><button type="button" data-act="cycleYearPrev" aria-label="上一年" '+(UI.cycleYear<=firstYear?'disabled':'')+'>‹</button><strong>'+UI.cycleYear+' 年</strong><button type="button" data-act="cycleYearNext" aria-label="下一年" '+(UI.cycleYear>=lastYear?'disabled':'')+'>›</button></div></div><div class="month-grid">';
  monthDays.forEach(function(days,idx){
    html+='<div class="month-cell'+(days.length?' filled':'')+'"><span>'+(idx+1)+' 月</span><strong>'+(days.length?days.join('、')+' 日':'—')+'</strong></div>';
  });
  html+='</div></section>';
  if(n>1){
    var barMax=Math.max(38,Math.max.apply(null,recent));
    html+='<section class="card cycle-trend"><div class="cycle-section-head"><div><h3>周期间隔波动</h3><p>'+list[recentStart+1].date.slice(0,7).replace('-','.')+'—'+last.date.slice(0,7).replace('-','.')+' · 两次开始日之间的天数</p></div><span class="cycle-average">平均 <b>'+Math.round(mean)+' 天</b></span></div><div class="bar-chart">';
    recent.forEach(function(g,idx){
      var listIndex=recentStart+idx+1,h=Math.max(8,Math.round(g/barMax*100));
      html+='<div class="bar-col'+(listIndex===n-1?' latest':'')+'" role="img" aria-label="'+fullDateLabel(list[listIndex].date)+'：距上次 '+g+' 天"><span class="bar-value">'+g+'</span><div class="bar-track"><i style="height:'+h+'%"></i></div><small>'+cycleMonthLabel(list[listIndex].date)+'</small></div>';
    });
    html+='</div><div class="cycle-axis"><i></i><span>橙色为最近一次 · 纵向 0–'+barMax+' 天</span></div></section>';
  }else{
    html+='<section class="card cycle-trend"><div class="cycle-section-head"><div><h3>周期间隔波动</h3><p>记录至少两次，才会出现趋势</p></div></div><div class="empty" style="padding:18px 12px">先记下一次，看看两次开始日相隔多少天。</div></section>';
  }
  var shown=UI.cycleHistory?list:list.slice(Math.max(0,n-4)),hidden=n-shown.length;
  html+='<section class="cycle-history"><button class="cycle-history-toggle '+(UI.cycleHistory?'open':'')+'" data-act="cycleHistory" aria-expanded="'+(UI.cycleHistory?'true':'false')+'"><span>历史记录 <small>'+n+' 次 · 每月开始日和相邻间隔</small></span><span class="chevron">⌄</span></button><div class="cycle-history-list">';
  var historyYear=null;
  for(var i=shown.length-1;i>=0;i--){
    var p=shown[i],originalIndex=list.indexOf(p),gap=originalIndex>=1?dayDiff(list[originalIndex-1].date,p.date):null;
    if(p.date.slice(0,4)!==historyYear){historyYear=p.date.slice(0,4);html+='<div class="history-year">'+historyYear+' 年</div>'}
    html+='<button class="history-row" type="button" data-act="periodEdit" data-id="'+p.id+'" aria-label="编辑 '+fullDateLabel(p.date)+'"><span class="history-dot"></span><span class="history-date"><strong>'+p.date.replace(/-/g,'.')+'</strong><small>'+fullDateLabel(p.date).split(' ')[1]+(p.note?' · '+esc(p.note):'')+'</small></span><span class="history-gap">'+(gap!=null?'<b>'+gap+'</b><small>天间隔</small>':'<small>最早一条</small>')+'</span><span class="history-edit">编辑</span></button>';
  }
  html+='</div>';
  if(hidden>0)html+='<button class="cycle-more" data-act="cycleHistory">展开其余 '+hidden+' 次记录</button>';
  html+='</section>';
  body.innerHTML=html;
}

function evRow(ev,hot){
  var m=ev.member?member(ev.member):null;
  var sub=[];
  if(ev.date)sub.push(evDateLabel(ev.date));
  if(ev.seg)sub.push(ev.seg);
  sub.push(kindLabel(ev.kind));
  if(m)sub.push(esc(m.name)+'提的');
  if(ev.note)sub.push(esc(ev.note));
  var right='';
  if(ev.status==='plan'){
    right='<span class="evacts">'+
      '<button class="btn small" data-act="eventDone" data-id="'+ev.id+'">做了</button>'+
      '<button class="btn ghost small" data-act="eventSkip" data-id="'+ev.id+'">没成</button></span>';
  }else if(ev.status==='done'){
    right='<span class="evtag"><span class="did">做了</span>'+(ratingLabel(ev.rating)?' · '+ratingLabel(ev.rating):'')+'</span>';
  }else if(ev.status==='skip'){
    right='<span class="evtag">没去成</span>';
  }else{
    right='<span class="evtag">想做</span>';
  }
  return '<div class="prow" data-act="eventEdit" data-id="'+ev.id+'" role="button" tabindex="0">'+
    (hot?'<span class="d pulse"></span>':'<span class="d mut"></span>')+
    '<div class="pdate">'+esc(ev.title)+'<span class="sub">'+sub.join(' · ')+'</span></div>'+right+'</div>';
}
function renderStudy(){
  var wk=thisWeekend(),today=todayIso();
  var thisWk=[],later=[],ideas=[],past=[];
  D.events.forEach(function(ev){
    if(!ev.date){ideas.push(ev);return}
    if(ev.date>=wk.sat&&ev.date<=wk.sun)thisWk.push(ev);
    else if(ev.date>wk.sun)later.push(ev);
    else past.push(ev);
  });
  thisWk.sort(function(a,b){return (a.date+(a.seg||'')).localeCompare(b.date+(b.seg||''))});
  later.sort(function(a,b){return a.date<b.date?-1:1});
  past.sort(function(a,b){return a.date>b.date?-1:1});
  var html='';
  /* 本周末 */
  html+='<div class="ig-title">本周末 · '+weekendLabel(wk)+'</div>';
  if(thisWk.length){
    html+=thisWk.map(function(ev){
      return evRow(ev,ev.status==='plan'&&(ev.date===today||ev.date===isoAdd(1)));
    }).join('');
  }else{
    html+='<div class="empty" style="padding:14px">这个周末还没有安排<br>想干什么，记一笔</div>';
  }
  /* 往后定的 */
  if(later.length){
    html+='<div class="ig-title" style="margin-top:14px">往后定的</div>';
    html+=later.map(function(ev){return evRow(ev,false)}).join('');
  }
  /* 想做池 */
  html+='<div class="ig-title" style="margin-top:14px">想做池 · 还没定日子</div>';
  if(ideas.length){
    html+=ideas.map(function(ev){return evRow(ev,false)}).join('');
  }else{
    html+='<div class="empty" style="padding:14px">听到什么好玩的，先丢进来</div>';
  }
  /* 往事：按周末分组（新的在上） */
  if(past.length){
    html+='<div class="ig-title" style="margin-top:14px">往事</div>';
    var groups=[];
    past.forEach(function(ev){
      var w=weekendOf(ev.date);
      if(!groups.length||groups[groups.length-1].key!==w.sat)groups.push({key:w.sat,w:w,list:[]});
      groups[groups.length-1].list.push(ev);
    });
    groups.forEach(function(g){
      html+='<div class="flabel" style="margin:10px 0 6px">'+weekendLabel(g.w)+'</div>';
      html+=g.list.map(function(ev){return evRow(ev,false)}).join('');
    });
  }
  /* 回顾门槛提示 */
  var doneN=D.events.filter(function(ev){return ev.status==='done'}).length;
  html+='<div class="hint" style="text-align:center;margin-top:14px">'+(doneN<8
    ?('已做完 '+doneN+' 件 · 攒到 8 件，书房会长出「回顾」')
    :(doneN+' 件了 · 「回顾」在下一个版本等你'))+'</div>';
  document.getElementById('studyBody').innerHTML=html;
}

function readIngs(){

    var name=r.querySelector('.n').value.trim(),
        qty=parseFloat(r.querySelector('.q').value),
        unit=r.querySelector('.u').value.trim()||'克';
    if(name&&qty>0)rows.push({name:name,qty:qty,unit:unit});
  });
  return rows;
}

/* 材料行拖动排序：拖 ☰ 换位置，保存时按当前顺序写入（readIngs 依 DOM 顺序） */
var ingDrag={row:null,startY:0,startTop:0};
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest('.ingrow .drag');
  if(!h)return;
  var row=h.closest('.ingrow');
  ingDrag.row=row;
  ingDrag.startY=e.clientY;
  ingDrag.startTop=row.offsetTop;
  row.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  var row=ingDrag.row;
  if(!row)return;
  var dy=e.clientY-ingDrag.startY;
  row.style.top=dy+'px';
  var box=row.parentElement;
  var sib=dy<0?row.previousElementSibling:row.nextElementSibling;
  while(sib&&sib.classList.contains('ingrow')){
    var sibMid=sib.offsetTop+sib.offsetHeight/2;
    var myMid=ingDrag.startTop+row.offsetHeight/2+dy;
    if(dy<0&&myMid<sibMid){
      box.insertBefore(row,sib);       /* 上移：插到前一行前面 */
    }else if(dy>0&&myMid>sibMid){
      box.insertBefore(sib,row);       /* 下移：后一行插到我前面 */
    }else break;
    row.style.top='0px';
    ingDrag.startTop=row.offsetTop;
    ingDrag.startY=e.clientY;
    dy=0;
    sib=row.nextElementSibling;
  }
});
function ingDragEnd(){
  if(!ingDrag.row)return;
  ingDrag.row.classList.remove('dragging');
  ingDrag.row.style.top='';
  ingDrag.row=null;
}
document.addEventListener('pointerup',ingDragEnd);
document.addEventListener('pointercancel',ingDragEnd);

/* 两段式确认：点别处自动解除（否则一旦点了「确认」就被困住） */
function armBtn(b){
  if(b.dataset.armed==='1')return false;
  b.dataset.orig=b.textContent;
  b.dataset.armed='1';
  b.textContent='再点一次确认删除';
  return true;
}
function disarmAll(except){
  document.querySelectorAll('[data-armed]').forEach(function(b){
    if(b===except||b.dataset.armed!=='1')return;
    b.dataset.armed='0';
    if(b.dataset.orig){b.textContent=b.dataset.orig;delete b.dataset.orig;}
  });
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-nav]');
  disarmAll(el); /* 任何一次点击都会解除别的按钮的待确认状态 */
  if(!el)return;
  /* 房间导航 */
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act^="step"]'))return;
  if(el.dataset.nav){
    if(el.dataset.nav==='soon'){
      var msgs={study:'书房还没整理好 —— 账本在排队'};
      toast(msgs[el.dataset.room]||'还没有整理好');
      return;
    }
    UI.view=el.dataset.nav;render();return;
  }
  var act=el.dataset.act;
  if(!act)return;

  switch(act){
    case 'navBack':UI.view='home';render();break;
    case 'closeSheet':closeSheet();break;

    /* 进门 */
    case 'createSheet':createSheet();break;
    case 'createGo':createGo(el);break;
    case 'joinGo':joinGo(el);break;
    case 'copyCode':
      copyText(AUTH?AUTH.code:'');
      break;

      dishSheet(el.dataset.id);break;

      run(api('PATCH','reservations?id=eq.'+el.dataset.id,{cook_id:AUTH.me},'return=minimal'),
        '接单了 · '+(me?me.name:'')+'来做');
      break;
    case 'cooked':
      var r0=resById(el.dataset.id);
      var p0=r0?api('DELETE','reservations?id=eq.'+el.dataset.id):Promise.resolve();
      if(r0){var d0=dish(r0.dishId);if(d0)p0=p0.then(function(){return api('PATCH','dishes?id=eq.'+d0.id,{times_cooked:d0.times+1},'return=minimal')})}
      run(p0,'做好了 · 又多了一次拿手菜');
      break;
    case 'cancelRes':

      break;

    case 'addIng':
      var box=document.getElementById('ingRows');
      box.insertAdjacentHTML('beforeend',ingRowHtml({name:'',qty:'',unit:'克'}));
      box.lastElementChild.querySelector('.n').focus();break;
    case 'rmIng':el.closest('.ingrow').remove();break;
    case 'estNutri':
      var est=estimate(readIngs(),parseInt(document.getElementById('dServ').value,10)||2);
      document.getElementById('nK').value=est.k;

    case 'saveDish':saveDish(el);break;
    case 'delDish':
      if(armBtn(el))return;
      run(api('DELETE','dishes?id=eq.'+el.dataset.id).then(function(){
        /* 预定会随外键级联删除 */
      }),function(){closeSheet();toast('已删除')});

    case 'cycleYearPrev':UI.cycleYear--;render();break;
    case 'cycleYearNext':UI.cycleYear++;render();break;
    case 'cycleHistory':UI.cycleHistory=!UI.cycleHistory;render();break;
    case 'periodNew':periodSheet();break;
    case 'periodSave':{
      var who=document.querySelector('#pWho .on');
      var pmid=who?parseInt(who.dataset.mid,10):UI.ptab;
      var pdate=document.getElementById('pDate').value;
      if(!validPeriodStart(pdate)){toast('选一个真实的、已经到来的日期');return}
      var pnote=document.getElementById('pNote').value.trim();
      UI.ptab=pmid;
      var wasDup=!!periodFind(pmid,pdate);
      /* upsert：同人同一天只更新备注，不产生重复 */
      run(api('POST','periods?on_conflict=family_id,member_id,start_date',
        {family_id:AUTH.fid,member_id:pmid,start_date:pdate,note:pnote,created_by:AUTH.me},
        'resolution=merge-duplicates,return=minimal'),
        function(){closeSheet();toast((wasDup?'备注已更新 · ':'记下了 · ')+dateLabel(pdate))});
      break;
    }
    case 'periodEdit':{
      var pe=periodById(el.dataset.id);
      if(pe)periodEditSheet(pe);
      break;
    }
    case 'periodEditSave':{
      var p0=periodById(el.dataset.id);
      if(!p0){closeSheet();return}
      var who3=document.querySelector('#pWho .on');
      var emid=who3?parseInt(who3.dataset.mid,10):p0.member;
      var edate=document.getElementById('pDate').value;
      if(!validPeriodStart(edate)){toast('选一个真实的、已经到来的日期');return}
      var enote=document.getElementById('pNote').value.trim();
      UI.ptab=emid;
      /* upsert 到新位置；改了人/日期时把旧的那条删掉（挪动） */
      var ep=api('POST','periods?on_conflict=family_id,member_id,start_date',
        {family_id:AUTH.fid,member_id:emid,start_date:edate,note:enote,created_by:AUTH.me},
        'resolution=merge-duplicates,return=minimal');
      if(emid!==p0.member||edate!==p0.date){
        ep=ep.then(function(){return api('DELETE','periods?id=eq.'+p0.id)});
      }
      run(ep,function(){closeSheet();toast('已保存')});
      break;
    }
    case 'periodEditDel':
      if(armBtn(el))return;
      run(api('DELETE','periods?id=eq.'+el.dataset.id),function(){closeSheet();toast('已删除')});
      break;
    case 'periodImport':periodImportSheet();break;
    case 'periodImportGo':{
      var who2=document.querySelector('#pWho .on');
      var imid=who2?parseInt(who2.dataset.mid,10):UI.ptab;
      var pr=parseBulk(document.getElementById('pBulk').value);
      if(!pr.rows.length){toast('没认出日期，看看格式对不对');return}
      var rows=pr.rows.map(function(x){
        return {family_id:AUTH.fid,member_id:imid,start_date:x.iso,note:x.note,created_by:AUTH.me};
      });
      UI.ptab=imid;
      run(api('POST','periods?on_conflict=family_id,member_id,start_date',rows,'resolution=merge-duplicates,return=minimal'),
        function(){closeSheet();toast('补进去了 '+rows.length+' 条'+(pr.bad?(' · 有 '+pr.bad+' 行没认出来'):''))});
      break;
    }

    /* 书房 · 周末新鲜事 */
    case 'eventNew':eventSheet(null);break;
    case 'eventEdit':
      if(e.target.closest('button'))break;
      var ev0=evById(el.dataset.id);
      if(ev0)eventSheet(ev0);
      break;
    case 'eventSave':{
      var eEv=el.dataset.id?evById(el.dataset.id):null;
      var eTitle=document.getElementById('eTitle').value.trim();
      if(!eTitle){toast('写点什么');return}
      var eKindBtn=document.querySelector('#eKind .on');
      if(!eKindBtn){toast('挑个类型');return}
      var eDate=document.getElementById('eDate').value||'';
      if(eDate&&!/^\d{4}-\d{2}-\d{2}$/.test(eDate)){toast('日期看着不对');return}
      var eSegBtn=document.querySelector('#eSeg .on');
      var eWhoBtn=document.querySelector('#eWho .on');
      var ePayload={
        title:eTitle,kind:eKindBtn.dataset.k,
        event_date:eDate||null,
        time_seg:eSegBtn?eSegBtn.dataset.s:null,
        member_id:eWhoBtn?parseInt(eWhoBtn.dataset.mid,10):null,
        note:document.getElementById('eNote').value.trim(),
        updated_at:new Date().toISOString()
      };
      var eP;
      if(eEv){
        if(eEv.status==='idea'||eEv.status==='plan')ePayload.status=eDate?'plan':'idea';
        eP=api('PATCH','weekend_events?id=eq.'+eEv.id,ePayload,'return=minimal');
      }else{
        ePayload.family_id=AUTH.fid;
        ePayload.status=eDate?'plan':'idea';
        ePayload.created_by=AUTH.me;
        eP=api('POST','weekend_events',ePayload,'return=minimal');
      }
      run(eP,function(){closeSheet();toast(eEv?'已保存':'记下了 · '+eTitle)});
      break;
    }
    case 'eventDel':
      if(armBtn(el))return;
      run(api('DELETE','weekend_events?id=eq.'+el.dataset.id),function(){closeSheet();toast('已删除')});
      break;
    case 'eventDone':{
      var ed=evById(el.dataset.id);
      if(ed)doneSheet(ed);
      break;
    }
    case 'eventDoneGo':{
      var rb=document.querySelector('#eRate .on');
      eventMarkDone(el.dataset.id,rb?parseInt(rb.dataset.r,10):null);
      break;
    }
    case 'eventDoneSkip':eventMarkDone(el.dataset.id,null);break;
    case 'eventSkip':
      run(api('PATCH','weekend_events?id=eq.'+el.dataset.id,{status:'skip',updated_at:new Date().toISOString()},'return=minimal'),
        '记下了 · 没去成');
      break;
    case 'eventReopen':{
      var er=evById(el.dataset.id);
      if(!er){closeSheet();return}
      run(api('PATCH','weekend_events?id=eq.'+er.id,{status:er.date?'plan':'idea',rating:null,updated_at:new Date().toISOString()},'return=minimal'),
        function(){closeSheet();toast('改回没做了')});
      break;
    }

    /* 书房 · 自定义类型 */
    case 'kindAdd':{ /* 记一笔弹层内联输入，不打断已填的内容 */
      var kr=document.getElementById('eKind');
      if(!kr)break;
      kr.innerHTML='<input class="finput" id="eNewKind" maxlength="12" placeholder="类型名，比如：逛博物馆" style="margin:2px 0 8px">'+
        '<div class="kchips" style="gap:7px"><button class="btn small" data-act="kindAddGo">加进去</button><button class="btn small ghost" data-act="kindCancel">取消</button></div>';
      var ni=document.getElementById('eNewKind');
      if(ni)ni.focus();
      break;
    }
    case 'kindAddGo':{
      var nl=document.getElementById('eNewKind').value.trim();
      if(!nl){toast('写个类型名');return}
      if(nl.length>12){toast('最多 12 个字');return}
      if(kindNameTaken(nl)){toast('和已有的类型重名了');return}
      run(api('POST','weekend_kinds',{family_id:AUTH.fid,label:nl,created_by:AUTH.me},'return=minimal'),
        function(){
          UI.eKindSel=nl;
          var kr2=document.getElementById('eKind');
          if(kr2)kr2.outerHTML=kindChips(nl);
          toast('「'+nl+'」加好了');
        });
      break;
    }
    case 'kindCancel':{
      var kr3=document.getElementById('eKind');
      if(kr3)kr3.outerHTML=kindChips(UI.eKindSel);
      break;
    }
    case 'kindManage':kindManageSheet();break;
    case 'kindRename':{
      var rk=kindById(el.dataset.id);
      if(!rk)break;
      var row=el.closest('.krow');
      if(row)row.innerHTML='<input class="finput" id="kRename" maxlength="12" value="'+esc(rk.label)+'">'+
        '<div class="kacts" style="margin-top:8px"><button class="btn small" data-act="kindRenameGo" data-id="'+rk.id+'">改好</button>'+
        '<button class="btn small ghost" data-act="kindManage">取消</button></div>';
      break;
    }
    case 'kindRenameGo':{
      var rk2=kindById(el.dataset.id);
      if(!rk2){closeSheet();return}
      var nl2=document.getElementById('kRename').value.trim();
      if(!nl2){toast('类型名不能是空的');return}
      if(nl2.length>12){toast('最多 12 个字');return}
      if(kindNameTaken(nl2,rk2.id)){toast('和已有的类型重名了');return}
      var old=rk2.label;
      /* 改词表 + 连带把用过这个类型的事一起改过去 */
      run(api('PATCH','weekend_kinds?id=eq.'+rk2.id,{label:nl2},'return=minimal')
        .then(function(){return api('PATCH','weekend_events?kind=eq.'+encodeURIComponent(old),{kind:nl2,updated_at:new Date().toISOString()},'return=minimal')}),
        function(){toast('改好了 · '+old+' → '+nl2);kindManageSheet()});
      break;
    }
    case 'kindDel':{
      if(armBtn(el))return;
      var kd=kindById(el.dataset.id);
      if(!kd)break;
      var cnt=D.events.filter(function(e){return e.kind===kd.label}).length;
      if(cnt){el.dataset.armed='0';el.textContent='删除';toast('还有 '+cnt+' 件事在用「'+kd.label+'」，先改掉再删');return}
      run(api('DELETE','weekend_kinds?id=eq.'+kd.id),function(){toast('删掉了');kindManageSheet()});
      break;
    }

    /* 成员 */
    case 'leave':
      closeSheet();logout();toast('已退出 · 随时可以再进来');
      break;
  }
});

/* ---------- 写操作实现 ---------- */
function createGo(btn){
  var my=document.getElementById('cMe').value.trim();
  var ta=document.getElementById('cTa').value.trim();
  if(!my||!ta){toast('两个名字都写上吧');return}
  if(my===ta){toast('名字得不一样，不然分不清谁是谁');return}
  btn.disabled=true;toast('正在开门…');
  var code=genCode();
  /* 注意：families 插入必须 return=minimal（representation 会被 SELECT 策略拒绝），
     fid 用 join_family RPC 凭码取回 —— 见 AGENTS.md「数据库约定」 */
  api('POST','families',{name:'我们的家',invite_code:code},'return=minimal').then(function(){
    return api('POST','rpc/join_family',{p_code:code});
  }).then(function(fam){
    AUTH={fid:fam[0].id,code:code,me:0};
    return api('POST','members',[
      {family_id:AUTH.fid,name:my,color:'#D0832F',sort:0},
      {family_id:AUTH.fid,name:ta,color:'#3E7A66',sort:1}
    ],'return=representation');
  }).then(function(ms){
    AUTH.me=ms[0].id;persistAuth();
    return sync();
  }).then(function(){
    UI.view='home';render();
    codeSheet(code);
  }).catch(function(err){
    toast('开不了门，稍后再试');
  }).then(function(){btn.disabled=false});
}

function joinGo(btn){
  var code=(document.getElementById('joinCode').value||'').trim().toUpperCase();
  if(!code){toast('输入家庭邀请码');return}
  btn.disabled=true;toast('正在对钥匙…');
  api('POST','rpc/join_family',{p_code:code}).then(function(r){
    if(!r||!r.length)throw new Error('badcode');
    AUTH={fid:r[0].id,code:code,me:0};
    return api('GET','members?select=*&order=sort.asc');
  }).then(function(ms){
    if(!ms||!ms.length)throw new Error('nomember');
    sync(); /* 后台拉数据 */
    pickSheet(ms);
  }).catch(function(err){
    var msg=String(err&&err.message||'');
    if(msg.indexOf('badcode')>=0)toast('邀请码不对，再看看');
    else if(msg.indexOf('nomember')>=0){AUTH=null;toast('这个家还没有成员，先联系创建人')}
    else toast('连不上云端，稍后再试');
  }).then(function(){btn.disabled=false});
}

function copyText(t){
  if(!t)return;
  try{
    navigator.clipboard.writeText(t).then(function(){toast('复制好了')},function(){toast('复制没成功，长按手动复制')});
  }catch(_){toast('复制没成功，长按手动复制')}
}

function saveDish(el){
  var name=document.getElementById('dName').value.trim();
  var ings=readIngs();
  if(!name){toast('先起个菜名');return}
  if(!ings.length){toast('至少写一样材料');return}
  var cooks=[];
  document.querySelectorAll('#cookChips .mchip').forEach(function(ch){
    if(ch.classList.contains('on'))cooks.push(parseInt(ch.dataset.mid,10));
  });
  if(!cooks.length)cooks=[AUTH.me];
  var n={k:parseInt(document.getElementById('nK').value,10)||0,
         p:parseInt(document.getElementById('nP').value,10)||0,
         c:parseInt(document.getElementById('nC').value,10)||0,
         f:parseInt(document.getElementById('nF').value,10)||0};
  var sv=parseInt(document.getElementById('dServ').value,10)||2;
  var payload={name:name,servings:sv,ingredients:ings,nutri:n,est:true,cooks:cooks};
  var p;
  if(el.dataset.id){
    p=api('PATCH','dishes?id=eq.'+el.dataset.id,payload,'return=minimal');
  }else{
    payload.family_id=AUTH.fid;
    payload.created_by=AUTH.me;
    p=api('POST','dishes',payload,'return=minimal');
  }
  run(p,function(){
    closeSheet();UI.ktab='menu';
    toast(el.dataset.id?('已更新 · '+name):('上架了 · '+name));
  });
}

function saveRes(el){
  var date=document.getElementById('resDate').value||todayIso();
  var mealBtn=document.querySelector('#resMeal .on');
  var meal=mealBtn?mealBtn.dataset.m:'晚餐';
  var cookBtn=document.querySelector('#resCook .on');
  var cook=cookBtn?cookBtn.dataset.mid:null;
  cook=cook?parseInt(cook,10):null;
  var d1=dish(el.dataset.id);
  run(api('POST','reservations',{family_id:AUTH.fid,dish_id:d1.id,date:date,meal:meal,cook_id:cook,created_by:AUTH.me},'return=minimal')
    .then(function(){return checkInv(d1)}).then(function(missing){
      closeSheet();UI.view='kitchen';UI.ktab='res';
      render();
      toast(missing.length?('已预定 · 缺 '+missing.length+' 样原料，已进购物清单'):'已预定 · 冰箱里原料都齐');
    }));
}

function saveInv(el){
  var nm=document.getElementById('iName').value.trim();
  if(!nm){toast('写个名字');return}
  var catBtn=document.querySelector('#iCat .on');
  var cat=catBtn?catBtn.dataset.c:'food';
  var q=parseFloat(document.getElementById('iQty').value)||0;
  var u=document.getElementById('iUnit').value.trim()||'个';
  var lw=parseFloat(document.getElementById('iLow').value)||0;
  var payload={name:nm,cat:cat,qty:q,unit:u,low:lw};
  var p;
  if(el.dataset.id){
    payload.updated_at=new Date().toISOString();
    p=api('PATCH','inventory?id=eq.'+el.dataset.id,payload,'return=minimal');
  }else{
    payload.family_id=AUTH.fid;
    p=api('POST','inventory',payload,'return=minimal');
  }
  run(p,function(){closeSheet()});
}

/* 弹层内单选 chips（mchip / seg2 / kchips） */
document.addEventListener('click',function(e){
  var ch=e.target.closest('.mchip,.seg2 button,.kchips button');
  if(!ch)return;
  if(ch.dataset.act)return; /* 「＋ 新类型 / 加进去 / 取消」走 data-act，不参与单选 */
  if(e.target.tagName==='INPUT')return;
  var group=ch.parentElement;
  if(group.id==='cookChips'){
    ch.classList.toggle('on');return; /* 多选 */
  }
  if(group.id==='pickMe'){
    AUTH.me=parseInt(ch.dataset.mid,10);persistAuth();
    closeSheet();
    UI.view='home';render();
    toast('回来了 · '+(member(AUTH.me)||{}).name);
    return;
  }
  group.querySelectorAll('.mchip,.seg2 button,button').forEach(function(x){x.classList.remove('on')});
  ch.classList.add('on');
  if(group.id==='meSel'){
    AUTH.me=parseInt(ch.dataset.mid,10);persistAuth();
    renderMeChip();
    toast('切到 '+(member(AUTH.me)||{}).name);
  }
  if(group.id==='pWho')periodCheckExisting(); /* 记一笔：换人后重新检查该天是否已记录 */
  if(group.id==='eKind')UI.eKindSel=ch.dataset.k; /* 书房：记住当前选的类型（取消新增时恢复） */
  if(group.id==='bCal'){ /* 生日：切农历/公历后重排月日选项（已选的月保留，日越界自动收拢） */
    UI.bCal=ch.dataset.cal;
    bdSelRender();
  }
  if(group.id==='eDateQuick'){ /* 书房：快捷日期同步写进日期输入框 */
    var edi=document.getElementById('eDate');
    if(edi)edi.value=ch.dataset.d||'';
  }
  if(group.id==='resDateQuick'){ /* 预定：快捷日期同步写进日期输入框（手动改输入框不回写，保存以输入框为准） */
    var rdi=document.getElementById('resDate');
    if(rdi)rdi.value=ch.dataset.d||'';
  }
});

/* 改名（防抖 → PATCH） */
var renameTid;
document.addEventListener('input',function(e){
  var inp=e.target.closest('input[data-rename]');
  if(!inp)return;
  clearTimeout(renameTid);
  var mid=parseInt(inp.dataset.rename,10),val=inp.value.trim();
  if(!val)return;
  renameTid=setTimeout(function(){
    var m=member(mid);
    if(m)m.name=val;
    renderMeChip();renderHome();
    api('PATCH','members?id=eq.'+mid,{name:val},'return=minimal').catch(function(){toast('名字没同步成功')});
  },600);
});

/* 头部 */
document.getElementById('backBtn').addEventListener('click',function(){UI.view='home';render()});
document.getElementById('todayCard').addEventListener('click',function(){
  UI.view='kitchen';UI.ktab='res';render();
});
document.getElementById('meChip').addEventListener('click',function(){
  if(AUTH&&D.members.length)memberSheet();
});
document.querySelectorAll('.ktab button').forEach(function(b){
  b.addEventListener('click',function(){UI.ktab=b.dataset.tab;render()});
});

/* 同步节奏：启动 / 回到前台 / 每 60 秒 */
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&AUTH)sync();
});
setInterval(function(){if(AUTH)sync()},60000);

/* 主题 */
var sun=document.getElementById('icoSun'),moon=document.getElementById('icoMoon');
function applyTheme(t){
  if(t==='dark')document.documentElement.dataset.theme='dark';
  else if(t==='light')document.documentElement.dataset.theme='light';
  else delete document.documentElement.dataset.theme;
  var dark=t==='dark'||(t==null&&matchMedia('(prefers-color-scheme: dark)').matches);
  sun.hidden=dark;moon.hidden=!dark;
  try{localStorage.setItem('jia-theme',t||'system')}catch(_){}
  catTheme(); /* 同步猫角 iframe 的主题 */
}
document.getElementById('themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.dataset.theme;
  var sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme((cur==='dark'||(cur==null&&sysDark))?'light':'dark');
});
var savedTheme=null;
try{savedTheme=localStorage.getItem('jia-theme')}catch(_){}
applyTheme(savedTheme||'system');

/* 启动 */
if(AUTH){
  UI.view='home';
  render();          /* 先画缓存，快 */
  sync(true);        /* 再拉云端 */
}else{
  UI.view='join';
  render();
}
})();
</script>
